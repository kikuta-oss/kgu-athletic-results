<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>体育会 大会一覧</title>
<style>
:root{
  --engi:#7A1E2E; --engi-deep:#5C1523; --engi-soft:#F6ECEE; --engi-line:#E7D2D6;
  --ink:#1D1D1F; --sub:#6E6E73; --bg:#F5F5F7; --card:#FFFFFF; --line:#E5E5EA;
  --radius:18px; --ease:cubic-bezier(.25,.1,.25,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  font-size:16px;line-height:1.6;letter-spacing:.01em}
a{color:var(--engi)}
/* nav */
.nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.72);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1080px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-weight:600;font-size:15px;color:var(--ink)}
.brand span{color:var(--engi)}
.nav-count{font-size:13px;color:var(--sub)}
/* hero */
.hero{background:linear-gradient(160deg,var(--engi) 0%,var(--engi-deep) 100%);color:#fff;padding:72px 24px 88px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.18),rgba(255,255,255,0) 70%)}
.hero-in{max-width:1080px;margin:0 auto;position:relative;z-index:1}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin:0 0 14px}
.hero h1{font-size:clamp(34px,6vw,56px);line-height:1.08;font-weight:700;letter-spacing:-.02em;margin:0 0 16px}
.hero p{font-size:18px;opacity:.85;margin:0;max-width:640px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:36px}
.stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:14px 20px;min-width:128px}
.stat b{display:block;font-size:28px;font-weight:700;letter-spacing:-.01em}
.stat small{font-size:13px;opacity:.8}
/* layout */
main{max-width:1080px;margin:-48px auto 0;padding:0 24px 96px;position:relative;z-index:2}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.06);padding:24px}
.tools{display:flex;flex-direction:column;gap:16px}
.search{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search input[type=search]{flex:1 1 280px;appearance:none;border:1px solid var(--line);background:#FAFAFB;border-radius:12px;
  padding:12px 16px;font:inherit;color:var(--ink);outline:none;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.search input[type=search]:focus{border-color:var(--engi);box-shadow:0 0 0 4px rgba(122,30,46,.12);background:#fff}
.toggle{display:inline-flex;align-items:center;gap:10px;font-size:14px;color:var(--sub);cursor:pointer;user-select:none}
.switch{width:44px;height:26px;border-radius:999px;background:#D1D1D6;position:relative;transition:background .25s var(--ease)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.toggle input{display:none}
.toggle input:checked + .switch{background:var(--engi)}
.toggle input:checked + .switch::after{transform:translateX(18px)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer;transition:all .2s var(--ease)}
.chip:hover{border-color:var(--engi-line)}
.chip.on{background:var(--engi);border-color:var(--engi);color:#fff}
.chip em{font-style:normal;opacity:.6;margin-left:4px;font-size:12px}
/* timeline */
.month{margin:48px 0 14px;display:flex;align-items:baseline;gap:12px}
.month h2{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
.month span{font-size:14px;color:var(--sub)}
.grid{display:grid;gap:12px}
.card{background:var(--card);border-radius:var(--radius);padding:18px 20px;box-shadow:0 1px 2px rgba(0,0,0,.04);
  border:1px solid transparent;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.card:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(0,0,0,.08)}
.card-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.club{font-size:12px;font-weight:600;color:var(--engi);background:var(--engi-soft);border-radius:999px;padding:3px 10px}
.date{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.badge{margin-left:auto;font-size:12px;font-weight:600;color:#fff;background:var(--engi);border:0;border-radius:999px;padding:4px 12px;cursor:pointer;font-family:inherit}
.badge:hover{background:var(--engi-deep)}
.title{font-size:17px;font-weight:600;margin:0;line-height:1.45}
.warn{font-size:12px;color:#B45309;margin-top:6px}
.res{display:none;margin-top:16px;border-top:1px solid var(--line);padding-top:16px}
.card.open .res{display:block;animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.res-meta{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:0 0 12px}
.res-meta dt{color:var(--sub)}
.res-meta dd{margin:0}
.res-body{font-size:14px;background:#FAFAFB;border-radius:12px;padding:14px 16px;white-space:pre-wrap;word-break:break-word;max-height:360px;overflow:auto;margin:0}
.res-tag{font-size:12px;color:var(--engi);font-weight:600;margin-bottom:8px;display:inline-block}
.empty{text-align:center;color:var(--sub);padding:48px 0}
.section-title{font-size:22px;font-weight:700;margin:64px 0 6px;letter-spacing:-.01em}
.section-sub{color:var(--sub);font-size:14px;margin:0 0 14px}
footer{max-width:1080px;margin:0 auto;padding:0 24px 48px;color:var(--sub);font-size:12px}
@media (max-width:640px){
  .hero{padding:56px 20px 72px}.stat{min-width:0;flex:1 1 40%}
  .card{padding:16px}.res-meta{grid-template-columns:1fr}
  .nav-count{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state = { club:'すべて', q:'', onlyRes:false };
const resById = Object.fromEntries(DATA.results.map(r => [r.id, r]));
const pad = d => d.replace(/^(\d{4})\/(\d{1,2})\/(\d{1,2}).*$/, (m,y,mo,da)=>`${y}/${mo}/${da}`);
const monthOf = sort => sort === '9999' ? '日程未定' : sort.slice(0,4) + '年' + parseInt(sort.slice(5,7)) + '月';

function clubs(){
  const counts = {};
  DATA.schedule.forEach(s => counts[s.club] = (counts[s.club]||0)+1);
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]);
}
function renderChips(){
  const all = ['すべて', ...clubs().map(([c])=>c)];
  const counts = Object.fromEntries(clubs());
  document.getElementById('chips').innerHTML = all.map(c =>
    `<button class="chip ${state.club===c?'on':''}" data-club="${esc(c)}">${esc(c)}${c==='すべて'?`<em>${DATA.schedule.length}</em>`:`<em>${counts[c]}</em>`}</button>`
  ).join('');
}
function matches(s){
  if (state.club!=='すべて' && s.club!==state.club) return false;
  if (state.onlyRes && !s.results.length) return false;
  if (state.q){
    const hay = (s.name+' '+s.club+' '+s.results.map(i=>resById[i].name).join(' ')).toLowerCase();
    if (!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}
function resPanel(r){
  return `<div class="res">
        <dl class="res-meta">
      <dt>大会名</dt><dd>${esc(r.name)}</dd>
      <dt>日程</dt><dd>${esc(r.date)||'—'}</dd>
      <dt>会場</dt><dd>${esc(r.venue)||'—'}</dd>
      <dt>主催</dt><dd>${esc(r.host)||'—'}</dd>
      <dt>申請部</dt><dd>${esc(r.club)}</dd>
      ${r.note ? `<dt>感想・特記</dt><dd>${esc(r.note)}</dd>` : ''}
    </dl>
    <pre class="res-body">${esc(r.result)||'結果未入力'}</pre>
  </div>`;
}
function card(s){
  const n = s.results.length;
  const badge = n ? `<button class="badge" data-toggle>詳細</button>` : '';
  const panels = s.results.map(i => resPanel(resById[i])).join('');
  return `<article class="card">
    <div class="card-top"><span class="club">${esc(s.club)}</span><span class="date">${esc(pad(s.date))}</span>${badge}</div>
    <p class="title">${esc(s.name)}</p>
    ${panels}
  </article>`;
}
function renderTimeline(){
  const list = DATA.schedule.filter(matches).sort((a,b)=> a.sort.localeCompare(b.sort) || a.id.localeCompare(b.id));
  const el = document.getElementById('timeline');
  if (!list.length){ el.innerHTML = '<div class="panel empty">該当する大会はありません</div>'; return; }
  let html = '', cur = null;
  for (const s of list){
    const m = monthOf(s.sort);
    if (m !== cur){
      if (cur !== null) html += '</div>';
      cur = m;
      const count = list.filter(x=>monthOf(x.sort)===m).length;
      html += `<div class="month"><h2>${m}</h2><span>${count} 件</span></div><div class="grid">`;
    }
    html += card(s);
  }
  html += '</div>';
  el.innerHTML = html;
}
function clubKey(s){
  return String(s).replace(/部$/,'').replace(/バレーボール/,'バレー').replace(/バスケットボール/,'バスケ').replace(/競技$/,'');
}
function renderAll(){ renderChips(); renderTimeline(); }

document.addEventListener('click', e => {
  const chip = e.target.closest('[data-club]');
  if (chip){ state.club = chip.dataset.club; renderAll(); return; }
  const t = e.target.closest('[data-toggle]');
  if (t){ t.closest('.card').classList.toggle('open'); t.textContent = t.closest('.card').classList.contains('open') ? '閉じる' : '詳細'; }
});
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; renderTimeline(); });
document.getElementById('onlyRes').addEventListener('change', e => { state.onlyRes = e.target.checked; renderTimeline(); });
renderAll();
</script>
